
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: axion-kv-secrets
  namespace: default

spec:
  provider: azure

  secretObjects:
    - secretName: postgres-secret
      type: Opaque
      data:
        - objectName: postgres-db
          key: POSTGRES_DB
        - objectName: postgres-username
          key: POSTGRES_USER
        - objectName: postgres-password
          key: POSTGRES_PASSWORD

    - secretName: pgadmin-secret
      type: Opaque
      data:
        - objectName: pgadmin-email
          key: PGADMIN_DEFAULT_EMAIL
        - objectName: pgadmin-password
          key: PGADMIN_DEFAULT_PASSWORD

    - secretName: telemetry-db-url
      type: Opaque
      data:
        - objectName: telemetry-database-url
          key: DATABASE_URL

  parameters:
    clientID: "a9b6c2d1-889d-4693-9d52-71c05d094ff5"
    keyvaultName: "axion-dev-kv1"
    tenantId: "8edda5a9-f65a-43bc-9e56-014eb34d335a"

    objects: |
      array:
        - |
          objectName: postgres-db
          objectType: secret
        - |
          objectName: postgres-username
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: pgadmin-email
          objectType: secret
        - |
          objectName: pgadmin-password
          objectType: secret
        - |
          objectName: telemetry-database-url
          objectType: secret
