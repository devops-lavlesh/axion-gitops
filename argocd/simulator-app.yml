
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: axion-simulator-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/devops-lavlesh/axion-gitops.git
    targetRevision: main
    path: environments/dev/simulator

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
